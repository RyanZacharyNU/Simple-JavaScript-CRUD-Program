<!DOCTYPE html>
<html> 
<head>
	<title>Simple Javascript CRUD</title>
</head>
<body>
	<h1>Student CRUD System</h1>
	<input type="hidden" id="editIndex" value="-1">
	<label>Student ID:</label>
	<input type="text" id="studentId">
	<br><br>
	<label>Student Name:</label>
	<input type="text" id="studentName">
	<br><br>
	<label>Course:</label>
	<input type="text" id="studentCourse">
	<br><br>
	<input type="button" onclick="saveStudent()" value="Save Student">
	<button onclick="clearForm()">Cancel</button>
	<hr>
	<h2>Student Records</h2>
	<label>Search Name:</label>
	<input type="text" id="searchName">
	<button onclick="searchStudent()">Search</button>
	<button onclick="displayStudents()">Show All</button>
	<button onclick="sortByName()">Sort by Name</button>
	<br><br>
	<table border="1" cellpadding="10">
		<thead> 
			<tr>
				<th>Number</th>
				<th>ID</th>
				<th>Name</th>
				<th>Course</th>
				<th>Actions</th>
			</tr>
		</thead>
		<tbody id="studentTable">
		</tbody>
	</table>
	<p id="totalCount">Total Students: 0</p>
	<script>
		let students = [];

		function isDuplicateId(id, excludeIndex) {
			for (let i = 0; i < students.length; i++) {
				if (i == excludeIndex) {
					continue;
				}
				if (students[i].id.toLowerCase() == id.toLowerCase()) {
					return true;
				}
			}
			return false;
		}

		function isDuplicateName(name, excludeIndex) {
			for (let i = 0; i < students.length; i++) {
				if (i == excludeIndex) {
					continue;
				}
				if (students[i].name.toLowerCase() == name.toLowerCase()) {
					return true;
				}
			}
			return false;
		}

		function saveStudent() {
			let id = document.getElementById("studentId").value.trim();
			let name = document.getElementById("studentName").value.trim();
			let course = document.getElementById("studentCourse").value.trim();
			let editIndex = parseInt(document.getElementById("editIndex").value);
			if (id == "" || name == "" || course == "") {
				alert("Please complete all fields.");
				return;
			}
			if (isDuplicateId(id, editIndex)) {
				alert("Student ID already exists. Please use a unique ID.");
				return;
			}
			if (isDuplicateName(name, editIndex)) {
				alert("Student name already exists. Please use a unique name.");
				return;
			}
			if (editIndex == -1) {
				let newStudent = {
					id: id,
					name: name,
					course: course
				};
				students[students.length] = newStudent;
				alert("Student saved successfully.");
			} else {
				students[editIndex].id = id;
				students[editIndex].name = name;
				students[editIndex].course = course;
				alert("Student updated successfully");
			}
			clearForm();
			displayStudents();
		}

		function buildRow(index) {
			return "<tr>" +
				 "<td>" + (index + 1) + "</td>" +
				 "<td>" + students[index].id + "</td>" +
				 "<td>" + students[index].name + "</td>" +
				 "<td>" + students[index].course + "</td>" +
				 "<td>" + "<button onclick='editStudent(" + index + ")'>Edit</button> " + "<button onclick='deleteStudent(" + index + ")'>Delete</button>" + "</td>" +
				 "</tr>";
		}

		function displayStudents() {
			let table = document.getElementById("studentTable");
			table.innerHTML = "";
			if (students.length == 0) {
				table.innerHTML ="<tr>" 
					+ "<td colspan='5'>No student records found.</td>" + "</tr>";
				updateTotal();
				return;
			}
			for (let index = 0; index < students.length; index++) {
				table.innerHTML += buildRow(index);
			}
			updateTotal();
		}

		function searchStudent() {
			let keyword = document.getElementById("searchName").value.toLowerCase();
			let table = document.getElementById("studentTable");
			table.innerHTML = "";
			let matchCount = 0;
			for (let index = 0; index < students.length; index++) {
				let studentName = students[index].name.toLowerCase();
				let found = false;
				for (let start = 0; start <= studentName.length - keyword.length; start++) {
					let matches = true;
					for (let letter = 0; letter < keyword.length; letter++) {
						if (studentName.charAt(start + letter) != keyword.charAt(letter)) {
							matches = false;
							break;
						}
					}
					if (matches) {
						found = true;
						break;
					}
				}
				if (keyword == "" || found) {
					table.innerHTML += buildRow(index);
					matchCount++;
				}
			}
			if (matchCount == 0) {
				table.innerHTML = "<tr>" 
					+ "<td colspan='5'>No matching student found.</td>" + "</tr>";
			}
			updateTotal();
		}

		function sortByName() {
			for (let i = 0; i < students.length - 1; i++) {
				for (let j = 0; j < students.length - 1 - i; j++) {
					if (students[j].name.toLowerCase() > students[j + 1].name.toLowerCase()) {
						let temp = students[j];
						students[j] = students[j + 1];
						students[j + 1] = temp;
					}
				}
			}
			displayStudents();
		}

		function updateTotal() {
			document.getElementById("totalCount").innerHTML = "Total Students: " + students.length;
		}

		function editStudent(index){
			document.getElementById("studentId").value = students[index].id;
			document.getElementById("studentName").value = students[index].name;
			document.getElementById("studentCourse").value = students[index].course;
			document.getElementById("editIndex").value = index;
		}
		function deleteStudent(index) {
			let answer = confirm("Are you sure you want to delete this student?");
			if (answer == false) {
				return;
			}
			for (let position = index; position < students.length - 1; position++) {
				students[position] = students[position + 1];
			}
			students.length = students.length - 1;
			clearForm();
			displayStudents();
			alert("Students deleted successfully.");
		}
		function clearForm() {
			document.getElementById("studentId").value = "";
			document.getElementById("studentName").value = "";
			document.getElementById("studentCourse").value = "";
			document.getElementById("editIndex").value = "-1";
		}
		displayStudents();
	</script>
</body>
</html>
